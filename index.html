<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#091519" />
  <meta name="description" content="长衣亭——一座临湖而立的皇家园林风格三维亭阁。" />
  <title>长衣亭 · 御园新境 臻饰版</title>
  <style>
    :root{
      color-scheme:dark;
      --gold:#e0bd72;
      --jade:#8dc4b7;
      --glass:rgba(7,18,21,.64);
      --line:rgba(225,236,232,.16);
      --text:#edf3ef;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#091519;font-family:"Songti SC","STSong","Noto Serif SC",serif}
    body{touch-action:none}
    #scene,canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
    .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 38%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.42) 118%),linear-gradient(to bottom,rgba(0,0,0,.09),transparent 34%,rgba(0,0,0,.26))}
    .grain{position:fixed;inset:-40%;z-index:3;pointer-events:none;opacity:.037;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.95'/%3E%3C/svg%3E");animation:grain .25s steps(2) infinite}
    @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(0,0)}}

    .topbar{position:fixed;left:0;right:0;top:0;z-index:5;padding:max(18px,env(safe-area-inset-top)) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .brand,.sound{pointer-events:auto}
    .eyebrow{margin:0 0 8px 2px;color:rgba(225,237,231,.60);font:600 9px/1.2 system-ui,sans-serif;letter-spacing:.34em}
    h1{margin:0;color:var(--text);font-size:clamp(30px,8.8vw,50px);line-height:1;font-weight:500;letter-spacing:.18em;text-shadow:0 3px 24px rgba(0,0,0,.44)}
    .seal{display:inline-grid;place-items:center;width:29px;height:29px;margin-left:7px;vertical-align:6px;border:1px solid rgba(224,189,114,.88);border-radius:3px;color:#e2bf78;background:rgba(76,25,18,.28);font-size:11px;letter-spacing:0;transform:rotate(-3deg)}
    .sound{border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#e2ebe5;padding:10px 13px;font-size:12px;letter-spacing:.12em;box-shadow:0 10px 32px rgba(0,0,0,.22)}

    .intro{position:fixed;left:18px;top:108px;z-index:5;width:min(62vw,330px);pointer-events:none;transition:opacity .7s ease,transform .7s ease}
    .intro.hide{opacity:0;transform:translateY(-8px)}
    .intro .line{width:44px;height:1px;margin-bottom:11px;background:linear-gradient(90deg,var(--gold),transparent)}
    .intro p{margin:0;color:rgba(231,239,234,.66);font-size:12px;line-height:1.8;letter-spacing:.12em;text-shadow:0 2px 14px rgba(0,0,0,.5)}

    .hint{position:fixed;left:50%;top:54%;z-index:5;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none;color:rgba(231,239,234,.72);font:600 10px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-shadow:0 2px 12px rgba(0,0,0,.7);transition:opacity .7s ease}
    .hint.hide{opacity:0}
    .gesture{position:relative;width:44px;height:44px;border:1px solid rgba(229,239,234,.34);border-radius:50%}
    .gesture:before,.gesture:after{content:"";position:absolute;background:rgba(230,239,234,.68);border-radius:999px}
    .gesture:before{left:13px;top:21px;width:17px;height:1px;animation:swipe 1.8s ease-in-out infinite}
    .gesture:after{left:19px;top:19px;width:5px;height:5px;box-shadow:0 0 10px rgba(255,255,255,.6);animation:dot 1.8s ease-in-out infinite}
    @keyframes swipe{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
    @keyframes dot{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

    .status{position:fixed;right:18px;top:92px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid rgba(226,236,231,.12);border-radius:999px;background:rgba(7,18,20,.36);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(231,239,234,.64);font:600 9px/1.2 system-ui,sans-serif;letter-spacing:.14em;pointer-events:none}
    .status i{display:block;width:6px;height:6px;border-radius:50%;background:#efbc68;box-shadow:0 0 12px rgba(239,188,104,.8)}

    .poem{position:fixed;left:50%;bottom:120px;z-index:8;width:min(88vw,430px);padding:21px 23px;transform:translate(-50%,18px);border:1px solid rgba(221,234,227,.16);border-radius:20px;background:linear-gradient(145deg,rgba(9,27,28,.84),rgba(7,16,18,.66));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 25px 70px rgba(0,0,0,.40);opacity:0;pointer-events:none;transition:.48s cubic-bezier(.2,.8,.2,1)}
    .poem.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .poem .close{position:absolute;right:12px;top:9px;border:0;background:none;color:rgba(232,241,236,.58);font-size:22px}
    .poem p{margin:0;text-align:center;color:#e9f0eb;font-size:15px;line-height:2.08;letter-spacing:.13em}
    .poem small{display:block;margin-top:12px;text-align:center;color:rgba(224,191,119,.78);font:600 9px/1.2 system-ui,sans-serif;letter-spacing:.23em}

    .controls{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:9;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;width:min(95vw,610px);padding:8px;border:1px solid var(--line);border-radius:21px;background:rgba(5,16,18,.68);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 64px rgba(0,0,0,.38)}
    .controls button{appearance:none;min-width:0;border:0;border-radius:14px;background:transparent;color:rgba(231,240,234,.80);font:600 10px/1.15 system-ui,sans-serif;padding:10px 2px;transition:background .2s ease,transform .2s ease,color .2s ease}
    .controls button.active{background:linear-gradient(180deg,rgba(224,189,114,.18),rgba(224,189,114,.06));color:#fff}
    .controls button:active{transform:scale(.96);background:rgba(255,255,255,.07)}
    .controls button span{display:block;margin-bottom:5px;color:var(--gold);font-family:serif;font-size:18px}

    #loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#091519;transition:opacity .7s ease,visibility .7s ease}
    #loading.done{opacity:0;visibility:hidden}
    .loader{text-align:center;color:#e7efe9;font-size:14px;letter-spacing:.22em}
    .loader:before{content:"";display:block;width:49px;height:49px;margin:0 auto 18px;border:1px solid rgba(215,234,224,.17);border-top-color:#e0bd72;border-radius:50%;animation:spin 1.05s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #error{display:none;position:fixed;inset:0;z-index:40;place-items:center;padding:38px;background:#091519;color:#e7eee9;text-align:center;line-height:1.8}
    #error strong{display:block;margin-bottom:12px;color:#e0bd72;font-size:22px}

    @media (max-width:420px){
      .intro{top:101px}.status{top:88px}.controls{gap:4px;padding:7px}.controls button{font-size:9px;padding:9px 1px}.controls button span{font-size:17px}}
    @media (min-width:700px){.topbar{padding:30px 34px}.intro{left:34px;top:126px}.status{right:34px;top:106px}.controls{bottom:28px}.poem{bottom:126px}}
    @media (prefers-reduced-motion:reduce){.grain,.gesture:before,.gesture:after,.loader:before{animation:none}}
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene" aria-label="长衣亭皇家园林三维场景"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">IMPERIAL GARDEN · THE POLISHED REALM</div>
      <h1>长衣亭<span class="seal">藏</span></h1>
    </div>
    <button id="soundBtn" class="sound" type="button">听风 · 静</button>
  </header>

  <section id="intro" class="intro">
    <div class="line"></div>
    <p>依湖而筑，重檐八角。<br>匾额四向皆可见，近看亦不隐于檐下。</p>
  </section>

  <div class="status"><i></i><span id="statusText">人眼仰观</span></div>
  <div id="hint" class="hint"><div class="gesture"></div><div>单指旋转 · 双指缩放</div></div>

  <section id="poem" class="poem" aria-live="polite">
    <button id="closePoem" class="close" type="button" aria-label="关闭">×</button>
    <p>长波承月，衣香入檐。<br>亭中无言，山水知意。</p>
    <small>未曾明说，亦不曾遗忘</small>
  </section>

  <nav class="controls" aria-label="镜头与场景控制">
    <button id="viewMain" class="active" type="button"><span>景</span>人眼</button>
    <button id="viewPlaque" type="button"><span>匾</span>正匾</button>
    <button id="viewEave" type="button"><span>檐</span>仰檐</button>
    <button id="viewInside" type="button"><span>亭</span>入亭</button>
    <button id="lightBtn" type="button"><span>灯</span>灯火</button>
    <button id="timeBtn" type="button"><span>月</span>昼夜</button>
  </nav>

  <div id="loading"><div class="loader">正在打磨御园臻境</div></div>
  <div id="error"><div><strong>场景未能载入</strong>请确认设备已联网，并通过 Chrome、Safari 或 GitHub Pages 打开此文件。</div></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';

    const host = document.getElementById('scene');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error');
    const hint = document.getElementById('hint');
    const intro = document.getElementById('intro');
    const poem = document.getElementById('poem');
    const statusText = document.getElementById('statusText');

    let scene, camera, renderer, controls, clock;
    let pavilion, reflector, waterOverlay, waterMaterial, skyMaterial, moon, stars, fireflies;
    let hemi, keyLight, rimLight, warmCore, plaqueSpotLights = [];
    let lanternMeshes = [], lanternLights = [], plaqueMeshes = [];
    let isNight = true, lampsOn = true, soundOn = false, interacted = false;
    let cameraTween = null, activeView = 'main';
    let audioCtx, windSource, windGain;
    let running = true, frameCount = 0;
    const PERF = { mobile: innerWidth < 700, low: innerWidth < 430 };
    const geometryCache = new Map();
    const textureCache = new Map();

    const C = {
      red:0x8d3027,
      redDark:0x5f211b,
      vermilion:0xa33a2e,
      gold:0xd2ad64,
      goldLight:0xe7cb8a,
      jade:0x3f6663,
      jadeDark:0x264a49,
      roof:0x3e5f62,
      roofDark:0x243b3f,
      ridge:0x8da0a2,
      wood:0x4a271e,
      woodDark:0x2b1511,
      stone:0xd9ddd8,
      stone2:0xb7bdb8,
      grass:0x385941,
      leaf:0x46774f
    };

    try{ init(); }catch(err){ fail(err); }

    function init(){
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0b1b1d, 0.0155);
      clock = new THREE.Clock();

      camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 260);
      camera.position.set(0, 2.55, 25.5);

      renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(devicePixelRatio, PERF.low ? 1.15 : PERF.mobile ? 1.3 : 1.65));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      host.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 6.4, 0);
      controls.enableDamping = true;
      controls.dampingFactor = .06;
      controls.enablePan = false;
      controls.minDistance = 7.5;
      controls.maxDistance = 40;
      controls.minPolarAngle = Math.PI*.28;
      controls.maxPolarAngle = Math.PI*.495;
      controls.autoRotate = true;
      controls.autoRotateSpeed = .14;
      controls.addEventListener('start', firstInteraction);

      createSky();
      createLighting();
      createWorld();
      createPavilion();
      createLandscape();
      createAtmosphere();
      freezeStaticMeshes();
      bindUI();

      addEventListener('resize', onResize, {passive:true});
      document.addEventListener('visibilitychange', ()=>{ running = !document.hidden; if(running) animate(); });
      renderer.domElement.addEventListener('pointerdown', onPointerDown, {passive:true});
      setTimeout(()=>loading.classList.add('done'), 700);
      animate();
    }

    function fail(err){
      console.error(err);
      errorBox.style.display='grid';
      loading.classList.add('done');
    }

    function mat(color,roughness=.7,metalness=.03){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
    function cachedGeometry(key, factory){
      if(!geometryCache.has(key)) geometryCache.set(key, factory());
      return geometryCache.get(key);
    }
    function mesh(geometry,material,parent=scene,cast=true,receive=true){
      const m=new THREE.Mesh(geometry,material);m.castShadow=cast;m.receiveShadow=receive;parent.add(m);return m;
    }
    function box(w,h,d,material,x,y,z,parent=scene,rx=0,ry=0,rz=0){
      const key=`b:${w.toFixed(3)}:${h.toFixed(3)}:${d.toFixed(3)}`;
      const m=mesh(cachedGeometry(key,()=>new THREE.BoxGeometry(w,h,d)),material,parent);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);return m;
    }
    function cyl(rt,rb,h,segments,material,x,y,z,parent=scene,rx=0,ry=0,rz=0){
      const key=`c:${rt.toFixed(3)}:${rb.toFixed(3)}:${h.toFixed(3)}:${segments}`;
      const m=mesh(cachedGeometry(key,()=>new THREE.CylinderGeometry(rt,rb,h,segments)),material,parent);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);return m;
    }
    function beamBetween(a,b,thickness,material,parent=scene){
      const p1=new THREE.Vector3(...a),p2=new THREE.Vector3(...b),dir=new THREE.Vector3().subVectors(p2,p1);
      const m=mesh(new THREE.BoxGeometry(thickness,dir.length(),thickness),material,parent,true,true);
      m.position.copy(p1).add(p2).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
      return m;
    }


    function freezeStaticMeshes(){
      scene.updateMatrixWorld(true);
      scene.traverse(o=>{
        if(o===scene || o===camera || o===fireflies)return;
        o.updateMatrix();o.matrixAutoUpdate=false;
      });
    }

    function createSky(){
      skyMaterial=new THREE.ShaderMaterial({
        side:THREE.BackSide,
        uniforms:{topColor:{value:new THREE.Color(0x081a25)},bottomColor:{value:new THREE.Color(0x315b54)},offset:{value:22},exponent:{value:.66}},
        vertexShader:`varying vec3 vWorldPosition;void main(){vec4 p=modelMatrix*vec4(position,1.0);vWorldPosition=p.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader:`uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;varying vec3 vWorldPosition;void main(){float h=normalize(vWorldPosition+vec3(0.0,offset,0.0)).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0);}`
      });
      mesh(new THREE.SphereGeometry(150,40,22),skyMaterial,scene,false,false);

      moon=mesh(new THREE.SphereGeometry(1.55,32,24),new THREE.MeshBasicMaterial({color:0xf8edcf}),scene,false,false);
      moon.position.set(-22,31,-52);
      const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:radialTexture(),color:0xffe7b7,transparent:true,opacity:.34,depthWrite:false}));
      halo.scale.set(10,10,1);moon.add(halo);

      const geo=new THREE.BufferGeometry();
      const count=innerWidth<650?360:680;
      const pos=new Float32Array(count*3);
      for(let i=0;i<count;i++){
        const r=72+Math.random()*48,t=Math.random()*Math.PI*2,p=Math.random()*Math.PI*.5;
        pos[i*3]=Math.cos(t)*Math.sin(p)*r;
        pos[i*3+1]=Math.cos(p)*r*.84+9;
        pos[i*3+2]=Math.sin(t)*Math.sin(p)*r;
      }
      geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0xedf6f0,size:.13,transparent:true,opacity:.76,sizeAttenuation:true}));
      scene.add(stars);
    }

    function radialTexture(){
      const c=document.createElement('canvas');c.width=c.height=128;
      const x=c.getContext('2d'),g=x.createRadialGradient(64,64,2,64,64,62);
      g.addColorStop(0,'rgba(255,248,222,.98)');g.addColorStop(.2,'rgba(255,231,177,.40)');g.addColorStop(1,'rgba(255,220,140,0)');
      x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
    }

    function createLighting(){
      hemi=new THREE.HemisphereLight(0x9fbcc5,0x273026,1.12);scene.add(hemi);
      keyLight=new THREE.DirectionalLight(0xc2dbe1,2.45);keyLight.position.set(-16,26,14);keyLight.castShadow=true;
      keyLight.shadow.mapSize.set(PERF.mobile?1024:2048,PERF.mobile?1024:2048);keyLight.shadow.camera.left=-26;keyLight.shadow.camera.right=26;keyLight.shadow.camera.top=26;keyLight.shadow.camera.bottom=-26;keyLight.shadow.bias=-.00035;scene.add(keyLight);
      rimLight=new THREE.DirectionalLight(0x7da8b7,.72);rimLight.position.set(18,15,-18);scene.add(rimLight);
      warmCore=new THREE.PointLight(0xffb65c,12.5,29,2);warmCore.position.set(0,7.1,0);warmCore.castShadow=false;scene.add(warmCore);
    }

    function createWorld(){
      const grass=mat(C.grass,.96),stone=mat(C.stone2,.94),pale=mat(C.stone,.92);
      const island=mesh(new THREE.CylinderGeometry(19.8,22.5,1.35,80),grass);island.position.y=-.82;
      const rim=mesh(new THREE.CylinderGeometry(20.0,21.8,.46,80),stone);rim.position.y=-.18;

      // The former loose stepping stones looked like horizontal sticks on the lake shore.
      // They are intentionally removed; the pavilion now uses one integrated stone staircase.
      for(let i=0;i<26;i++){
        const a=i/26*Math.PI*2,r=18.4+Math.random()*1.6;
        const rock=mesh(new THREE.DodecahedronGeometry(.5+Math.random()*.7,0),stone);
        rock.position.set(Math.cos(a)*r,-.02,Math.sin(a)*r);rock.scale.set(1.45,.65+Math.random()*.75,1.05);rock.rotation.set(Math.random(),Math.random(),Math.random());
      }

      const refSize=PERF.low?320:PERF.mobile?448:768;
      reflector=new Reflector(new THREE.PlaneGeometry(120,120),{clipBias:.003,textureWidth:refSize,textureHeight:refSize,color:0x41666b});
      reflector.rotation.x=-Math.PI/2;reflector.position.y=-.14;
      reflector.material.transparent=true;reflector.material.opacity=.72;
      const reflectRender=reflector.onBeforeRender.bind(reflector);
      reflector.onBeforeRender=(...args)=>{
        const cadence=PERF.low?3:PERF.mobile?2:1;
        if(frameCount<3 || cameraTween || frameCount%cadence===0) reflectRender(...args);
      };
      scene.add(reflector);

      waterMaterial=new THREE.ShaderMaterial({
        transparent:true,depthWrite:false,side:THREE.DoubleSide,
        uniforms:{uTime:{value:0},uNight:{value:1},uGlow:{value:1}},
        vertexShader:`uniform float uTime;varying vec2 vUv;varying vec3 vWorld;void main(){vUv=uv;vec3 p=position;float w=sin(p.x*.30+uTime*.55)*.07+cos(p.y*.47-uTime*.46)*.05;p.z+=w;vWorld=(modelMatrix*vec4(p,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
        fragmentShader:`uniform float uTime;uniform float uNight;uniform float uGlow;varying vec2 vUv;varying vec3 vWorld;void main(){vec3 day=mix(vec3(.15,.40,.46),vec3(.48,.70,.67),vUv.y);vec3 night=mix(vec3(.01,.08,.11),vec3(.09,.29,.31),vUv.y);vec3 c=mix(day,night,uNight);float ripple=.5+.5*sin((vWorld.x+vWorld.z)*1.35+uTime*1.5);float sparkle=pow(max(0.0,sin(vWorld.x*.58+vWorld.z*.26+uTime*1.8)),22.0)*.23;float center=exp(-abs(vWorld.x)*.22)*exp(-abs(vWorld.z)*.09);c+=mix(vec3(.38,.58,.58),vec3(.95,.62,.25),uGlow*.42)*center*(.05+.14*ripple);gl_FragColor=vec4(c+sparkle,.28+.08*ripple);}`
      });
      waterOverlay=mesh(new THREE.PlaneGeometry(120,120,PERF.mobile?42:60,PERF.mobile?42:60),waterMaterial,scene,false,false);waterOverlay.rotation.x=-Math.PI/2;waterOverlay.position.y=-.10;

      for(let layer=0;layer<3;layer++){
        const mm=mat(layer===0?0x1d3735:layer===1?0x142c2a:0x0e2020,1);
        for(let i=0;i<11;i++){

    // Correct yaw for a box whose long axis is local X.  The old formula

    function segmentYaw(p1,p2){
      return Math.atan2(-(p2.z-p1.z),p2.x-p1.x);

    function createStoneReliefRing(radius,y,stone,accent,parent){
      for(let i=0;i<8;i++){

        const p2=new THREE.Vector3(Math.cos(a2)*radius,y,Math.sin(a2)*radius);
        const mid=p1.clone().add(p2).multiplyScalar(.5);
        // Leave the front stair opening clear.
        if(mid.z>6.45)continue;

        panel.position.add(new THREE.Vector3(mid.x,0,mid.z).normalize().multiplyScalar(.045));

        med.position.copy(panel.position);med.position.y=y;med.rotation.y=segmentYaw(p1,p2);

    function createOctagonalStoneRail(radius,y,material,parent){

        const a1=Math.PI/8+i*Math.PI/4,a2=a1+Math.PI/4;
        const mid=(a1+a2)/2;

        const p2=new THREE.Vector3(Math.cos(a2)*radius,y,Math.sin(a2)*radius);
        addRailSegment(p1,p2,material,parent,true);
      }
    }

    function createOctagonalRoof({inner,outer,yPeak,yEave,lift,top,topAlt,under,ridge,trim,tileMat,rows,lines}){
      const group=new THREE.Group();
      for(let s=0;s<8;s++){
        const rot=s*Math.PI/4;
        const topGeo=roofSectorGeometry(inner,outer,yPeak,yEave,lift,false);
        const topMesh=mesh(topGeo,s%2?topAlt:top,group,true,true);topMesh.rotation.y=rot;
        const underGeo=roofSectorGeometry(inner*.96,outer*.99,yPeak-.13,yEave-.17,lift*.54,true);
        const underMesh=mesh(underGeo,under,group,true,true);underMesh.rotation.y=rot;
      }

      for(let i=0;i<8;i++){
        const a=Math.PI/8+i*Math.PI/4;
        const p1=[Math.cos(a)*inner,yPeak,Math.sin(a)*inner];
        const p2=[Math.cos(a)*outer,yEave+.34,Math.sin(a)*outer];
        beamBetween(p1,p2,.14,ridge,group);
        const o=new THREE.Vector3(Math.cos(a),0,Math.sin(a));
        beamBetween(p2,[p2[0]+o.x*.82,p2[1]+.56,p2[2]+o.z*.82],.10,trim,group);
        const tip=mesh(new THREE.SphereGeometry(.15,10,8),trim,group);tip.position.set(p2[0]+o.x*.84,p2[1]+.57,p2[2]+o.z*.84);
        createRoofBeast(p2,o,trim,group,i);
      }

      addInstancedTiles(group,{inner,outer,yPeak,yEave,lift,rows,lines,material:tileMat});

      const cap=mesh(new THREE.CylinderGeometry(inner*.78,inner*.96,.20,8),ridge,group);cap.position.y=yPeak-.04;cap.rotation.y=Math.PI/8;
      return group;
    }

    function roofSectorGeometry(inner,outer,yPeak,yEave,lift,underside){
      const uSeg=14,vSeg=16,pos=[],uv=[],idx=[];

        const v=vI/vSeg,r=inner+(outer-inner)*v;

          const u=uI/uSeg,angle=-half+u*half*2,edge=Math.pow(Math.abs(u*2-1),1.8);
          let y=yPeak+(yEave-yPeak)*v;
          if(!underside){y-=Math.sin(v*Math.PI)*lift*.20;y+=edge*Math.pow(v,1.72)*lift*.82}
          else{y-=.27+Math.sin(v*Math.PI)*lift*.08;y+=edge*Math.pow(v,1.7)*lift*.36}
          pos.push(Math.sin(angle)*r,y,-Math.cos(angle)*(r+Math.pow(v,1.45)*.23));uv.push(u*2.8,v*4.6);
        }
      }
      for(let v=0;v<vSeg;v++)for(let u=0;u<uSeg;u++){
        const a=v*(uSeg+1)+u,b=a+1,c=a+uSeg+1,d=c+1;

    }

    function roofPoint(inner,outer,yPeak,yEave,lift,sector,u,v){
      const half=Math.PI/8,local=-half+u*half*2,angle=sector*Math.PI/4+local,r=inner+(outer-inner)*v,edge=Math.pow(Math.abs(u*2-1),1.8);
      let y=yPeak+(yEave-yPeak)*v-Math.sin(v*Math.PI)*lift*.20+edge*Math.pow(v,1.72)*lift*.82;
      return new THREE.Vector3(Math.sin(angle)*r,y,-Math.cos(angle)*(r+Math.pow(v,1.45)*.23));
    }

    function createHalfTileGeometry(radius=.105,segments=7){
      const key=`halfTile:${radius}:${segments}`;
      return cachedGeometry(key,()=>{
        const pos=[],uv=[],idx=[];
        for(let iy=0;iy<=1;iy++){
          const y=iy-.5;
          for(let i=0;i<=segments;i++){
            const t=i/segments*Math.PI;
            pos.push(Math.cos(t)*radius,y,Math.sin(t)*radius);
            uv.push(i/segments,iy);
          }
        }
        for(let i=0;i<segments;i++){
          const a=i,b=i+1,c=(segments+1)+i,d=c+1;
          idx.push(a,c,b,b,c,d);
        }
        const geo=new THREE.BufferGeometry();geo.setIndex(idx);geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.computeVertexNormals();return geo;
      });
    }

    function createHalfDiscGeometry(radius=.108,segments=9){
      const key=`halfDisc:${radius}:${segments}`;
      return cachedGeometry(key,()=>{
        const pos=[0,0,0],idx=[];
        for(let i=0;i<=segments;i++){
          const t=i/segments*Math.PI;
          pos.push(Math.cos(t)*radius,0,Math.sin(t)*radius);
        }
        for(let i=1;i<=segments;i++)idx.push(0,i,i+1);
        const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.computeVertexNormals();return geo;
      });
    }

    function tileFrame(inner,outer,yPeak,yEave,lift,sector,u,v1,v2){
      const p1=roofPoint(inner,outer,yPeak,yEave,lift,sector,u,v1),p2=roofPoint(inner,outer,yPeak,yEave,lift,sector,u,v2);
      const along=new THREE.Vector3().subVectors(p2,p1);const len=along.length();along.normalize();
      const eps=.015,ua=Math.max(.01,u-eps),ub=Math.min(.99,u+eps);
      const across=new THREE.Vector3().subVectors(roofPoint(inner,outer,yPeak,yEave,lift,sector,ub,(v1+v2)/2),roofPoint(inner,outer,yPeak,yEave,lift,sector,ua,(v1+v2)/2)).normalize();
      let normal=new THREE.Vector3().crossVectors(across,along).normalize();
      if(normal.y<0){across.negate();normal.crossVectors(across,along).normalize();}
      const basis=new THREE.Matrix4().makeBasis(across,along,normal);
      return {p1,p2,along,normal,basis,len};

    function addInstancedTiles(parent,{inner,outer,yPeak,yEave,lift,rows,lines,material}){
      const actualRows=PERF.low?Math.max(5,rows-3):PERF.mobile?Math.max(6,rows-2):rows;
      const actualLines=PERF.low?Math.max(5,lines-2):PERF.mobile?Math.max(6,lines-1):lines;
      const shellGeom=createHalfTileGeometry(PERF.mobile?.095:.105,PERF.mobile?6:8);
      const capGeom=createHalfDiscGeometry(PERF.mobile?.098:.108,PERF.mobile?7:10);
      const count=8*actualLines*actualRows;
      const shell=new THREE.InstancedMesh(shellGeom,material,count);
      shell.castShadow=!PERF.mobile;shell.receiveShadow=true;shell.instanceMatrix.setUsage(THREE.StaticDrawUsage);
      const caps=new THREE.InstancedMesh(capGeom,material,8*actualLines);
      caps.castShadow=false;caps.receiveShadow=true;caps.instanceMatrix.setUsage(THREE.StaticDrawUsage);
      const dummy=new THREE.Object3D(),capDummy=new THREE.Object3D();
      const cool=new THREE.Color(0x667e82),light=new THREE.Color(0x819598),dark=new THREE.Color(0x526b70);
      let n=0,cn=0;
      for(let s=0;s<8;s++)for(let l=0;l<actualLines;l++){
        const u=(l+.5)/actualLines;
        const step=.90/actualRows;
        for(let r=0;r<actualRows;r++){
          const v1=.045+r*step,v2=Math.min(.985,v1+step*1.18);
          const f=tileFrame(inner,outer,yPeak,yEave,lift,s,u,v1,v2);
          dummy.position.copy(f.p1).add(f.p2).multiplyScalar(.5).addScaledVector(f.normal,.065);
          dummy.quaternion.setFromRotationMatrix(f.basis);dummy.scale.set(1,f.len*1.04,1);dummy.updateMatrix();shell.setMatrixAt(n,dummy.matrix);
          shell.setColorAt(n,(r+l+s)%5===0?light:(r+l)%4===0?dark:cool);n++;
        }
        const f=tileFrame(inner,outer,yPeak,yEave,lift,s,u,.94,.985);
        capDummy.position.copy(f.p2).addScaledVector(f.along,.025).addScaledVector(f.normal,.065);
        capDummy.quaternion.setFromRotationMatrix(f.basis);capDummy.scale.set(1,1,1);capDummy.updateMatrix();caps.setMatrixAt(cn,capDummy.matrix);
        caps.setColorAt(cn,l%4===0?light:cool);cn++;
      }
      shell.instanceMatrix.needsUpdate=true;if(shell.instanceColor)shell.instanceColor.needsUpdate=true;
      caps.instanceMatrix.needsUpdate=true;if(caps.instanceColor)caps.instanceColor.needsUpdate=true;
      parent.add(shell,caps);
    }

    function moveToView(name){
      activeView=name;
      document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
      const button={main:'viewMain',plaque:'viewPlaque',eave:'viewEave',inside:'viewInside'}[name];if(button)document.getElementById(button).classList.add('active');
      let pos,target,label;
      if(name==='main'){pos=new THREE.Vector3(0,2.55,25.5);target=new THREE.Vector3(0,6.35,0);label='人眼仰观'}
      else if(name==='plaque'){pos=new THREE.Vector3(0,4.78,11.2);target=new THREE.Vector3(0,5.05,5.20);label='匾额正视'}
      else if(name==='eave'){pos=new THREE.Vector3(5.8,2.35,10.8);target=new THREE.Vector3(2.2,8.35,1.4);label='檐下仰观'}

      statusText.textContent=label;
      if(reflector) reflector.visible = name !== 'inside';
      cameraTween={fromPos:camera.position.clone(),fromTarget:controls.target.clone(),toPos:pos,toTarget:target,start:performance.now(),duration:1200};

    function onPointerDown(e){
      if(e.pointerType==='touch')return;
      const rect=renderer.domElement.getBoundingClientRect(),mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);
      if(ray.intersectObjects(plaqueMeshes,false)[0]){moveToView('plaque');poem.classList.add('show')}

    function toggleLamps(){

    async function toggleSound(){

    function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<430?1.15:innerWidth<700?1.3:1.65));renderer.setSize(innerWidth,innerHeight)}
